# =============================================================================
# AdminAI — Docker Compose
# Orchestrates the backend infrastructure:
#   - postgres     : PostgreSQL 16 with the pgvector extension (app DB + vectors)
#   - ollama       : local inference server for the bge-m3 embedding model
#   - ollama-init  : one-shot job that pulls the bge-m3 model into ollama
#   - backend      : Spring Boot API (built from ./backend)
#
# Usage:
#   docker compose up -d            # start everything
#   docker compose logs -f backend  # follow backend logs
#   docker compose down             # stop (keeps volumes / data)
#   docker compose down -v          # stop and DELETE all data
# =============================================================================

name: adminai

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adminai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, only when the data volume is empty.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - adminai-net

  # ---------------------------------------------------------------------------
  # Ollama — serves the bge-m3 embedding model locally
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: adminai-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - adminai-net
    # To enable NVIDIA GPU acceleration, uncomment the block below and ensure
    # the NVIDIA Container Toolkit is installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # One-shot: pull the embedding model, then exit.
  # ---------------------------------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    container_name: adminai-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${EMBEDDING_MODEL:-bge-m3}"]
    restart: "no"
    networks:
      - adminai-net

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adminai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Ollama is used at ingestion/query time (embeddings), not required at boot.
      ollama:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # Datasource
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      # LLM
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      # Embeddings
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # Storage
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/app/storage}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      # RAG
      RAG_KNOWLEDGE_BASE_PATH: /app/knowledge-base
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-storage:/app/storage
      # The French administrative corpus, ingested via POST /api/v1/rag/reindex
      - ./knowledge-base:/app/knowledge-base:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - adminai-net

  # ---------------------------------------------------------------------------
  # Dashboard — Angular app served by nginx (reverse-proxies /api to backend)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: adminai-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${DASHBOARD_PORT:-4200}:80"
    networks:
      - adminai-net

volumes:
  pgdata:
    name: adminai-pgdata
  ollama-data:
    name: adminai-ollama-data
  backend-storage:
    name: adminai-backend-storage

networks:
  adminai-net:
    name: adminai-net
    driver: bridge
